version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: diskominfo_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: diskominfo_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
